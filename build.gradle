plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
	id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "No-Sugar"
}
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {

            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            property 'mixin.config.disable', 'true'

        }
    }
}

configurations.create('sugarlibShadow')

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
	maven { url "https://maven.kosmx.dev/" }
	maven { url "https://maven.theillusivec4.top/" } // Caelus, Curios
    maven { url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" } // GeckoLib
    maven { url 'https://jitpack.io' }
    flatDir {
        dirs 'libs'
    }
}

dependencies {

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"

    compileOnly fg.deobf(files("libs/irons_spellbooks-1.20.1-3.4.0.11.jar"))
    runtimeOnly fg.deobf(files("libs/irons_spellbooks-1.20.1-3.4.0.11.jar"))
    compileOnly fg.deobf(files("libs/eraser-1.10.3.jar"))
    runtimeOnly fg.deobf(files("libs/eraser-1.10.3.jar"))
    compileOnly fg.deobf(files("libs/TConstruct.jar"))
    runtimeOnly fg.deobf(files("libs/TConstruct.jar"))
    compileOnly fg.deobf(files("libs/Mantle-1.20.1-1.11.79.jar"))
    runtimeOnly fg.deobf(files("libs/Mantle-1.20.1-1.11.79.jar"))
    compileOnly fg.deobf(files("libs/SlashBladeResharped-1.20.1-1.8.61.jar"))
    runtimeOnly fg.deobf(files("libs/SlashBladeResharped-1.20.1-1.8.61.jar"))
    compileOnly fg.deobf(files("libs/SlashBladeResharped-1.20.1-1.8.61.jar"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    runtimeOnly fg.deobf(files("libs/sugarlib.jar"))
    compileOnly fg.deobf(files("libs/sugarlib.jar"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.0")) {
        jarJar.ranged(it, "[0.5.0,)")
    }
    compileOnly(annotationProcessor('net.bytebuddy:byte-buddy:1.14.17'))
    implementation(jarJar('net.bytebuddy:byte-buddy:1.14.17')) {
        jarJar.ranged(it, "[1.14.17,)")
    }
    /*implementation(jarJar("com.test:sugarlib:1.0")) {
        jarJar.ranged(it, "[1.0,)")
    }*/
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

mixin {
    config 'nosugar.mixins.json'
    add sourceSets.main, "nosugar.refmap.json"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

shadowJar {
    archiveClassifier.set('')

    configurations = [project.configurations.sugarlibShadow]

    relocate 'com.test.sugarlib', 'shaded.com.test.sugarlib'
    mergeServiceFiles()
    zip64 true

    doFirst {
        println "Shadowing configurations: ${configurations.join(", ")}"
        configurations.forEach { config ->
            println "Files in $config:"
            config.files.each { file ->
                println "  - $file"
            }
        }
    }
}

jar {
    enabled = true
    archiveClassifier.set('slim')
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configure {
    finalizedBy 'reobfJar'
}

build.dependsOn shadowJar
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

version = mod_version
group = mod_group_id

base {
    archivesName = "No-Sugar"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

configurations {
    annotationProcessor {
        exclude group: 'org.spongepowered', module: 'mixin'
    }
}

sourceSets {
    main {
        resources { srcDir 'src/generated/resources' }
        java {
            include 'com/test/nosugar/transformer/**'
        }
        resources {
            include 'com/test/nosugar/transformer/**'
            exclude 'nosugar.mixins.json'
            exclude '*.mixins.json'
        }
    }

    embeddedMain {
        java {
            srcDirs = ['src/main/java']
            include 'com/test/nosugar/**'
            exclude 'com/test/nosugar/transformer/**'
        }
        resources {
            srcDirs = ['src/main/resources']
            include 'assets/**'
            include 'data/**'
            include 'nosugar.mixins.json'
            include 'META-INF/mods.toml'
            include 'pack.mcmeta'
            exclude 'com/test/nosugar/transformer/**'
        }
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.embeddedMain
                }
            }
        }
        client { property 'forge.enabledGameTestNamespaces', mod_id }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            property 'mixin.config.disable', 'true'
        }
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.kosmx.dev/" }
    maven { url "https://maven.theillusivec4.top/" }
    maven { url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    maven { url 'https://jitpack.io' }
    maven { url "https://www.cursemaven.com" }
    flatDir { dirs 'libs' }
}
configurations {
    shadowImpl
    compileOnly.extendsFrom shadowImpl
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation jarJar("io.github.llamalad7:mixinextras-forge:0.5.3") {
        jarJar.ranged(it, "[0.5.3,)")
    }
    compileOnly("io.github.llamalad7:mixinextras-common:0.5.3")
    shadowImpl "net.bytebuddy:byte-buddy:1.14.12"
    shadowImpl "net.bytebuddy:byte-buddy-agent:1.14.12"

    implementation fg.deobf("curse.maven:geckolib-388172:7553267")
    implementation fg.deobf("curse.maven:playeranimator-658587:4587214")
    implementation fg.deobf("curse.maven:curios-309927:6418456")
    implementation fg.deobf("curse.maven:slashblade-resharped-1022428:7363505")
    implementation fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:7691158")
    implementation fg.deobf("curse.maven:tinkers-construct-74072:7449219")
    implementation fg.deobf("curse.maven:mantle-74924:7563777")

    embeddedMainAnnotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    embeddedMainAnnotationProcessor "io.github.llamalad7:mixinextras-common:0.5.3"
}

def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    from('src/main/resources') {
        filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
            expand replaceProperties + [project: project]
        }
        filesMatching('META-INF/coremods.toml') {
            rename 'coremods.toml', 'mods.toml'
            expand replaceProperties + [project: project]
        }
    }
    exclude 'META-INF/mods.toml'
    exclude 'META-INF/coremods.toml'
    exclude { it.file.path.contains('com/test/nosugar') && !it.file.path.contains('transformer') }
}

tasks.named('processEmbeddedMainResources', ProcessResources).configure {
    inputs.properties replaceProperties
    exclude 'META-INF/coremods.toml'
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.register('embeddedMainJar', ShadowJar) {
    dependsOn 'compileEmbeddedMainJava', 'processEmbeddedMainResources'
    from sourceSets.embeddedMain.output
    from("${buildDir}/tmp/compileEmbeddedMainJava/") {
        include 'compileEmbeddedMainJava-refmap.json'
        rename 'compileEmbeddedMainJava-refmap.json', 'nosugar.refmap.json'
    }
    exclude 'META-INF/services/cpw.mods.modlauncher.serviceapi.ILaunchPluginService'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    destinationDirectory = layout.buildDirectory.dir('embedded')
    archiveBaseName = 'nosugar-main'
    archiveVersion = ""
    archiveClassifier = ''
    archiveExtension = 'jar'
    manifest {
        attributes(['ModLauncher-LauncherAPI': '1.0', 'MixinConfigs': 'nosugar.mixins.json'])
    }
}

tasks.register('reobfEmbeddedJar', JavaExec) {
    dependsOn 'embeddedMainJar', 'createMcpToSrg'
    def inputJar = layout.buildDirectory.file('embedded/nosugar-main.jar')
    def outputJar = layout.buildDirectory.file('embedded/nosugar-main.jar.embed')
    def mappingsFile = tasks.named('createMcpToSrg').flatMap { it.output }

    inputs.file(inputJar)
    inputs.file(mappingsFile)
    outputs.file(outputJar)

    classpath = configurations.detachedConfiguration(dependencies.create('net.minecraftforge:renamer:2.0.4:all'))
    mainClass = 'net.minecraftforge.renamer.Main'

    doFirst {
        def argsList = ['--input', inputJar.get().asFile.absolutePath, '--output', outputJar.get().asFile.absolutePath, '--names', mappingsFile.get().asFile.absolutePath, '--disable-abstract-param']
        sourceSets.embeddedMain.compileClasspath.files.each { if (it.exists()) argsList.addAll(['--lib', it.absolutePath]) }
        args = argsList
    }
}

shadowJar {
    dependsOn('reobfEmbeddedJar')
    configurations = [project.configurations.shadowImpl]
    from sourceSets.main.output

    into('META-INF/jars') {
        from layout.buildDirectory.file('embedded/nosugar-main.jar.embed')
    }

    relocate 'net.bytebuddy', 'com.test.nosugar.shadow.bytebuddy'
    exclude 'META-INF/maven/**'
    exclude 'module-info.class'
    archiveClassifier = 'all'
}

afterEvaluate {
    tasks.named('reobfJar') {
        input = tasks.named('jarJar').flatMap { it.archiveFile }
    }
}

tasks.named('jar', Jar) {
    archiveClassifier = 'raw'
}

tasks.named('jarJar') {
    dependsOn('shadowJar')
    archiveClassifier = ''
    enabled = true
    doFirst {
        mainSpec.sourcePaths.clear()
    }

    from(provider { zipTree(shadowJar.archiveFile.get().asFile) }) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

mixin {
    add sourceSets.embeddedMain, 'nosugar.refmap.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}